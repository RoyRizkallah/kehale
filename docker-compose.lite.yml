# Lightweight stack — dashboard + analytics from CSV (no Oracle)
# Use when Docker has low disk or Oracle import is not needed:
#   docker compose -f docker-compose.lite.yml up -d --build

services:
  analytics:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kehale-analytics
    environment:
      ORACLE_ENABLED: "false"
      USE_CSV_FALLBACK: "true"
      WAIT_FOR_IMPORT: "false"
      KEEP_ALIVE: "true"
    volumes:
      - ./data:/app/data
      - ./municipal_analysis:/app/municipal_analysis
      - ./output:/app/output
      - ./dashboard:/app/dashboard
    restart: unless-stopped

  dashboard:
    image: nginx:alpine
    container_name: kehale-dashboard
    ports:
      - "8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - analytics
    restart: unless-stopped
